name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear .env con credenciales
        run: |
          cat > .env <<EOF
          APP_NAME=SafetyRental
          APP_ENV=production
          APP_KEY=base64:lXg72qCwlan4poE/kmKuWOSkx3my8lrt675/IuovR1k=
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL || 'https://136.80.171.31/' }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DOCKERHUB_TOKEN1=${{ secrets.DOCKERHUB_TOKEN1 }}

          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          CACHE_STORE=database

          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

          PARTNER_API_URL=${{ secrets.PARTNER_API_URL || 'http://136.119.15.69/api/products' }}
          PARTNER_API_ITEMS_PATH=
          EOF

      - name: Docker login
        if: github.event_name == 'push'
        run: echo "${{ secrets.DOCKERHUB_TOKEN1 }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build . --file Dockerfile \
            --tag iocampos1/safetyrental:latest \
            --tag iocampos1/safetyrental:${{ github.sha }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push iocampos1/safetyrental:latest
          docker push iocampos1/safetyrental:${{ github.sha }}
