<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safety Rental — diagrama de arquitectura</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
        }
        header {
            padding: 24px 32px 8px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        p {
            margin: 0;
            color: #4b5563;
        }
        .diagram {
            padding: 16px 24px 40px;
        }
        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            display: block;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <header>
        <h1>Diagrama de arquitectura — Safety Rental</h1>
        <p>US-30 / D3. Comunicaciones de entrada y salida, Docker y GCP.</p>
    </header>
    <div class="diagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
            <title id="title">Safety Rental inbound and outbound architecture</title>
            <desc id="desc">Browsers and next teams send HTTPS into a Dockerized Laravel app on GCP Cloud Run. Laravel reads MySQL and calls the team 05 API and Google Maps Routes API.</desc>
            <rect width="1200" height="640" fill="#f8fafc"/>
            <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Safety Rental architecture</text>
            <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Inbound HTTPS from browsers and allied teams. Outbound HTTPS to team 05 and Google Maps Routes. Deployed as a Docker image on GCP Cloud Run.</text>

            <rect x="40" y="120" width="240" height="90" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
            <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Customer / admin</text>
            <text x="160" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Browser · Blade HTML</text>

            <rect x="40" y="250" width="240" height="90" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
            <text x="160" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Next team apps</text>
            <text x="160" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">GET /api/vehicles JSON</text>

            <rect x="380" y="160" width="440" height="250" rx="20" fill="#111827"/>
            <text x="600" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">GCP Cloud Run</text>
            <text x="600" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d1d5db">Docker image · PHP 8.3 · Laravel 13 MVC</text>
            <rect x="420" y="250" width="360" height="130" rx="14" fill="#ffffff"/>
            <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Safety Rental</text>
            <text x="600" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">web.php · controllers · Eloquent · Blade</text>
            <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Helpers for outbound HTTP only</text>

            <rect x="920" y="110" width="240" height="90" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
            <text x="1040" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Cloud SQL / MySQL</text>
            <text x="1040" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Inbound to DB from Laravel</text>

            <rect x="920" y="230" width="240" height="90" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
            <text x="1040" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Team 05 partner API</text>
            <text x="1040" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">PARTNER_API_URL</text>

            <rect x="920" y="350" width="240" height="90" rx="16" fill="#ffffff" stroke="#111827" stroke-width="2"/>
            <text x="1040" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Google Maps Routes</text>
            <text x="1040" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">GOOGLE_MAPS_API_KEY server-side</text>

            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
                </marker>
            </defs>

            <line x1="280" y1="165" x2="380" y2="230" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="280" y1="295" x2="380" y2="300" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="820" y1="250" x2="920" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="820" y1="310" x2="920" y2="275" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="820" y1="350" x2="920" y2="395" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

            <text x="300" y="150" font-family="Arial, sans-serif" font-size="11" fill="#111827">inbound HTML</text>
            <text x="288" y="330" font-family="Arial, sans-serif" font-size="11" fill="#111827">inbound JSON</text>
            <text x="830" y="175" font-family="Arial, sans-serif" font-size="11" fill="#111827">Eloquent</text>
            <text x="824" y="255" font-family="Arial, sans-serif" font-size="11" fill="#111827">outbound GET</text>
            <text x="824" y="430" font-family="Arial, sans-serif" font-size="11" fill="#111827">outbound POST</text>

            <rect x="40" y="480" width="1120" height="120" rx="16" fill="#ffffff" stroke="#d1d5db"/>
            <text x="60" y="515" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Secrets and failure handling</text>
            <text x="60" y="542" font-family="Arial, sans-serif" font-size="13" fill="#374151">Environment only: PARTNER_API_URL, PARTNER_API_TOKEN, GOOGLE_MAPS_API_KEY. The Google key is never rendered in Blade or JavaScript.</text>
            <text x="60" y="566" font-family="Arial, sans-serif" font-size="13" fill="#374151">Both outbound HTTP clients map timeout, connection loss, HTTP errors, empty bodies, and missing configuration to translated UI messages.</text>
            <text x="60" y="590" font-family="Arial, sans-serif" font-size="13" fill="#374151">A local JSON file does not replace the partner consumption. Deploy the Docker image to Cloud Run and inject secrets with Secret Manager.</text>
        </svg>
    </div>
</body>
</html>
